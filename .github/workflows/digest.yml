name: Azure Updates Digest

on:
  schedule:
    # 23:00 UTC daily == 08:00 KST the next morning
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: false
        default: "7"
      include_seen:
        description: "Include updates already published in an earlier digest"
        type: boolean
        required: false
        default: false
      translate_limit:
        description: "Maximum updates to translate into Korean in this run (0 = no limit)"
        required: false
        default: "150"
      send_email:
        description: "Send the email newsletter"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: azure-updates-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # The `secrets` context is not available in step-level `if`, so surface the check here.
    env:
      HAS_AZURE_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' }}
    outputs:
      has_updates: ${{ steps.digest.outputs.has_updates }}
      subject: ${{ steps.digest.outputs.subject }}
      count: ${{ steps.digest.outputs.count }}
      digest_date: ${{ steps.digest.outputs.digest_date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Azure updates
        id: fetch
        run: |
          python scripts/fetch_updates.py \
            --days "${{ inputs.days || '7' }}" \
            ${{ inputs.include_seen == true && '--include-seen' || '' }}

      - name: Sign in to Azure
        # The subscription forbids local (key) auth on Cognitive Services, so the translation
        # pass authenticates with a short-lived Entra ID token obtained through OIDC.
        if: env.HAS_AZURE_OIDC == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mint an Azure OpenAI token
        if: env.HAS_AZURE_OIDC == 'true'
        run: |
          TOKEN=$(az account get-access-token \
            --resource https://cognitiveservices.azure.com \
            --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "AZURE_OPENAI_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Summarize linked documentation and translate into Korean
        id: enrich
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          python scripts/enrich_updates.py \
            --input archive --limit 120 --sleep 0.4 \
            --translate-limit "${{ inputs.translate_limit || '150' }}"

      - name: Build digest and email
        id: digest
        run: python scripts/build_digest.py --skip-empty

      - name: Build Pages site
        run: python scripts/build_site.py

      - name: Commit digest and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digests
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: Azure updates digest ${{ steps.digest.outputs.digest_date }} (${{ steps.digest.outputs.count }} updates, ${{ steps.enrich.outputs.translated_count || 0 }} translated)"
            git push
          fi

      - name: Upload email artifacts
        uses: actions/upload-artifact@v4
        with:
          name: email-${{ steps.digest.outputs.digest_date }}
          path: build/
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  email:
    needs: digest
    runs-on: ubuntu-latest
    # On a schedule the `inputs` context is empty, and an empty value compares equal to
    # `false`, so a plain `inputs.send_email != false` would skip every scheduled run.
    # Only honour the toggle when the run actually came from the manual dispatch form.
    if: >-
      needs.digest.outputs.has_updates == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.send_email)
    steps:
      # Check out main after the digest job pushed, so the freshly committed
      # data/latest.json and subscriber list are the ones we send from.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet azure-communication-email

      - name: Verify mail configuration
        id: smtp
        env:
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          SUBSCRIBE_API_BASE: ${{ secrets.SUBSCRIBE_API_BASE }}
        run: |
          if [ -z "$ACS_CONNECTION_STRING" ] || [ -z "$SUBSCRIBE_API_BASE" ]; then
            echo "ACS_CONNECTION_STRING or SUBSCRIBE_API_BASE is not set; skipping email."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send to subscribers
        id: send
        if: steps.smtp.outputs.configured == 'true'
        env:
          ACS_CONNECTION_STRING: ${{ secrets.ACS_CONNECTION_STRING }}
          ACS_SENDER: ${{ secrets.ACS_SENDER }}
          SUBSCRIBE_API_BASE: ${{ secrets.SUBSCRIBE_API_BASE }}
          SUBSCRIBE_API_KEY: ${{ secrets.SUBSCRIBE_API_KEY }}
        run: python scripts/send_digest.py --date "${{ needs.digest.outputs.digest_date }}"

