name: Subscription mailbox

# Reads the digest mailbox and applies subscribe / unsubscribe requests to the
# encrypted subscriber list, so readers can join without anyone doing it by hand.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without applying it"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: azure-updates-subscriptions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet cryptography

      - name: Check configuration
        id: cfg
        env:
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: |
          if [ -z "$IMAP_SERVER" ] || [ -z "$SUBSCRIBER_KEY" ]; then
            echo "IMAP_SERVER or SUBSCRIBER_KEY is not set; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Process subscription mail
        id: sync
        if: steps.cfg.outputs.ready == 'true'
        env:
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FOLDER: ${{ secrets.IMAP_FOLDER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
        run: |
          python scripts/mailbox_sync.py ${{ inputs.dry_run == true && '--dry-run' || '' }}

      - name: Commit subscriber changes
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: subscriptions +${{ steps.sync.outputs.subscribed }} -${{ steps.sync.outputs.unsubscribed }} (${{ steps.sync.outputs.active }} active)"
            git push
          fi
